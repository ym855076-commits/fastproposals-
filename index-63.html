<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>FastProposals — Быстрые КП</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5fb; --card:#fff; --ink:#1b1d3a; --muted:#6b7090; --line:#e4e6f2;
  --field:#f6f7fc; --brand:#4f46e5; --brand-d:#4338ca; --brand-soft:#eceafd;
  --gold:#fbbf24; --danger:#e5484d; --shadow:0 2px 14px rgba(40,40,100,.08);
  --r:16px;
}
:root[data-theme="dark"]{
  --bg:#0d0f1f; --card:#171a30; --ink:#eef0ff; --muted:#9a9fc4; --line:#2a2e4d;
  --field:#1e2240; --brand:#7c74ff; --brand-d:#6a62f0; --brand-soft:#262a55;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  transition:background .3s,color .3s;
}
button,input,select,textarea{font:inherit;color:inherit}

/* верхняя панель */
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--brand)}
.logo img{width:28px;height:28px;border-radius:8px}
.tools{display:flex;gap:6px}
.chip{
  min-height:40px;min-width:44px;padding:0 12px;border-radius:12px;
  background:var(--field);border:1px solid var(--line);font-weight:700;font-size:14px;
  cursor:pointer;transition:transform .12s,background .2s;
}
.chip:active{transform:scale(.95)}
select.chip{appearance:none;-webkit-appearance:none;text-align:center}

main{max-width:560px;margin:0 auto;padding:16px 14px;display:grid;gap:16px}

.hero{text-align:center;padding:4px 6px 0}
.hero h1{margin:0 0 6px;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);font-size:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:14px}
.card h2{margin:0;font-size:16px;font-weight:800}
.field{display:grid;gap:5px}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
input,textarea,select{
  width:100%;min-height:48px;padding:11px 13px;border-radius:12px;
  background:var(--field);border:1.5px solid var(--line);outline:none;font-size:16px;
  transition:border-color .2s,box-shadow .2s;
}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* услуги */
.items-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
#items{display:grid;gap:10px}
.item{
  display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--field);
  animation:pop .25s ease both;
}
.item .desc{background:var(--card)}
.item-b{display:grid;grid-template-columns:76px 1fr 48px;gap:8px;align-items:center}
.item-b input{background:var(--card);min-width:0}
.del{
  height:48px;width:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
  color:var(--danger);font-size:18px;font-weight:800;cursor:pointer;transition:transform .12s,background .2s;
}
.del:active{transform:scale(.92);background:color-mix(in srgb,var(--danger) 14%,var(--card))}
.add{
  min-height:44px;padding:0 14px;border-radius:12px;border:1.5px dashed var(--brand);
  background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px;cursor:pointer;
}
.add:active{transform:scale(.96)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* документ (всегда белый, как лист А4) */
.docwrap{display:grid;gap:8px}
.docwrap .cap{font-size:13px;font-weight:700;color:var(--muted);padding:0 4px}
.scroller{overflow-x:auto;border-radius:var(--r)}
.doc{
  background:#fff;color:#1b1d3a;border:1px solid #e4e6f2;border-radius:var(--r);
  padding:20px;font-size:13px;line-height:1.45;box-shadow:var(--shadow);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.doc *{color:inherit}
.doc .d-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid #4f46e5}
.doc .d-co{font-size:17px;font-weight:800;color:#4f46e5}
.doc .d-sub{color:#6b7090;font-size:12px;margin-top:2px}
.doc .d-no{text-align:right;font-size:12px;color:#6b7090}
.doc .d-no b{display:block;color:#4f46e5;font-size:14px}
.doc .d-to{margin:14px 0 2px;color:#6b7090;font-size:12px;font-weight:700}
.doc .d-client{font-size:15px;font-weight:700}
.doc .d-title{margin:12px 0;font-size:17px;font-weight:800;line-height:1.25}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px}
.doc th{background:#eceafd;color:#4338ca;text-align:left;padding:7px 8px;font-size:12px}
.doc th.r,.doc td.r{text-align:right;white-space:nowrap}
.doc td{padding:8px;border-bottom:1px solid #e4e6f2;vertical-align:top;word-break:break-word}
.doc .d-total{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;margin-top:12px}
.doc .d-total span{color:#6b7090;font-size:13px}
.doc .d-total b{font-size:21px;color:#4f46e5}
.doc .d-terms{margin-top:14px;padding:10px 12px;border-radius:10px;background:#f6f7fc;border:1px solid #e4e6f2;font-size:12.5px;white-space:pre-line}
.doc .d-terms b{display:block;color:#6b7090;font-size:12px;margin-bottom:2px}
.doc .d-sign{display:flex;justify-content:space-between;gap:24px;margin-top:34px;font-size:12px;color:#6b7090}
.doc .d-sign div{flex:1;border-top:1px solid #9aa0c0;padding-top:4px}

/* нижняя панель */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.btn{
  min-height:52px;border-radius:14px;border:0;font-weight:800;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  transition:transform .12s,filter .2s;
}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--brand);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn.alt{background:#229ed9;color:#fff}
.btn[disabled]{opacity:.6;pointer-events:none}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact .btn{min-height:48px;font-size:14px;color:#fff}
.contact .tg{background:#229ed9}.contact .imo{background:#2563eb}
.note{margin:0;text-align:center;font-size:13px;color:var(--muted)}

.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:#1b1d3a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><img src="icon.svg" alt="" width="28" height="28">FastProposals</div>
  <div class="tools">
    <select id="currency" class="chip" aria-label="Валюта"><option value="TMT">TMT</option><option value="USD">USD</option></select>
    <button class="chip" id="langBtn" type="button">Türkmençe</button>
    <button class="chip" id="themeBtn" type="button" aria-label="Тема">🌙</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1 data-i="heroTitle">Хватит тратить часы на ручное составление КП!</h1>
    <p data-i="heroSub">Создайте профессиональное коммерческое предложение за 1 минуту прямо с телефона.</p>
  </section>

  <section class="card">
    <h2 data-i="formTitle">Данные предложения</h2>
    <div class="field"><label for="company" data-i="lComp">Ваша компания</label><input id="company" autocomplete="organization"></div>
    <div class="field"><label for="contact" data-i="lContact">Ваш контакт / телефон</label><input id="contact" autocomplete="off"></div>
    <div class="field"><label for="client" data-i="lClient">Клиент (имя / компания)</label><input id="client" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label for="number" data-i="lNumber">Номер КП</label><input id="number" autocomplete="off"></div>
      <div class="field"><label for="title" data-i="lTitle">Заголовок КП</label><input id="title" autocomplete="off"></div>
    </div>

    <div>
      <div class="items-head">
        <span class="lbl"><span data-i="lServices">Услуги и цена</span> (<span id="curLbl">TMT</span>)</span>
        <button class="add" id="addBtn" type="button" data-i="btnAdd">+ Добавить</button>
      </div>
      <div id="items" style="margin-top:10px"></div>
    </div>

    <div class="field"><label for="terms" data-i="lTerms">Условия и сроки</label><textarea id="terms"></textarea></div>
  </section>

  <section class="docwrap">
    <div class="cap" data-i="prevLabel">Так выглядит документ</div>
    <div class="scroller"><div class="doc" id="doc"></div></div>
  </section>

  <section class="card">
    <p class="note" data-i="contactNote">Нужен такой сайт или помощь? Напишите автору:</p>
    <div class="contact">
      <a class="btn tg" href="https://t.me/Yusupmur" target="_blank" rel="noopener">✈️ Telegram</a>
      <a class="btn imo" href="imo:chat?phone=99363778188">💬 Imo</a>
    </div>
  </section>
</main>

<nav class="bar">
  <button class="btn main" id="pdfBtn" type="button" data-i="btnDownload">📥 Скачать PDF</button>
  <button class="btn alt" id="shareBtn" type="button" data-i="btnShare">✈️ Отправить</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var KEY='fp_v2';

var T={
 ru:{heroTitle:'Хватит тратить часы на ручное составление КП!',heroSub:'Создайте профессиональное коммерческое предложение за 1 минуту прямо с телефона.',
  formTitle:'Данные предложения',lComp:'Ваша компания',lContact:'Ваш контакт / телефон',lClient:'Клиент (имя / компания)',lNumber:'Номер КП',lTitle:'Заголовок КП',
  lServices:'Услуги и цена',btnAdd:'+ Добавить',lTerms:'Условия и сроки',btnDownload:'📥 Скачать PDF',btnShare:'✈️ Отправить',
  prevLabel:'Так выглядит документ',contactNote:'Нужен такой сайт или помощь? Напишите автору:',
  doc:{badge:'Коммерческое предложение',to:'Кому:',th1:'Услуга',thq:'Кол.',thp:'Цена',ths:'Сумма',tot:'Итого:',ter:'Условия:',sg1:'Исполнитель',sg2:'Заказчик',noTitle:'Без названия',service:'Услуга'},
  descPh:'Название услуги',qtyPh:'Кол.',pricePh:'Цена',
  msgPdf:'Готовлю PDF…',msgDone:'PDF сохранён',msgErr:'Не получилось создать PDF. Проверьте интернет и повторите.',msgShareNo:'Отправка не поддерживается — PDF сохранён, отправьте его вручную',msgLoadErr:'Нет интернета для создания PDF'},
 tm:{heroTitle:'Täjirçilik tekliplerini düzmäge wagt ýitirmäň!',heroSub:'Telefon arkaly 1 minudyň içinde hünär derejesindäki täjirçilik teklibini dörediň.',
  formTitle:'Teklif maglumatlary',lComp:'Siziň kompaniýaňyz',lContact:'Habarlaşmak üçin belgi',lClient:'Müşderi (ady / kompaniýa)',lNumber:'Teklibiň belgisi',lTitle:'Teklibiň ady',
  lServices:'Hyzmatlar we baha',btnAdd:'+ Goşmak',lTerms:'Möhletler we şertler',btnDownload:'📥 PDF ýükläp almak',btnShare:'✈️ Ibermek',
  prevLabel:'Resminama şeýle görünýär',contactNote:'Şeýle sahypa ýa-da kömek gerekmi? Awtora ýazyň:',
  doc:{badge:'Täjirçilik teklibi',to:'Kime:',th1:'Hyzmat',thq:'Sany',thp:'Baha',ths:'Jemi',tot:'Jemi:',ter:'Şertler:',sg1:'Ýerine ýetiriji',sg2:'Sargyt beriji',noTitle:'Atsyz',service:'Hyzmat'},
  descPh:'Hyzmatyň ady',qtyPh:'Sany',pricePh:'Baha',
  msgPdf:'PDF taýýarlanýar…',msgDone:'PDF ýazdyryldy',msgErr:'PDF döredip bolmady. Internedi barlap gaýtadan synanyşyň.',msgShareNo:'Ibermek goldanylmaýar — PDF ýazdyryldy, özüňiz iberiň',msgLoadErr:'PDF döretmek üçin internet ýok'}
};

var defaults={
 company:'«Rowaç Alada» HJM',contact:'Yusup, +993 63 77-81-88',client:'HK «Bäsdeş»',
 title:'Söwda ulgamyny awtomatlaşdyrmak',number:'',
 terms:'Ýerine ýetiriş möhleti: 7 iş güni. Töleg 50% öňünden.',
 currency:'TMT',lang:'ru',theme:null,
 items:[{d:'IT-audit we ulgamy oturtmak',q:1,p:2500}]
};
var S=JSON.parse(JSON.stringify(defaults));

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return n.toLocaleString('ru-RU',{maximumFractionDigits:2})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0}

function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o){if(o[k]!==undefined)S[k]=o[k]}}}catch(e){}
  if(!Array.isArray(S.items)||!S.items.length)S.items=[{d:'',q:1,p:0}];
  if(!S.number)S.number=nextNumber();
  if(!S.theme)S.theme=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function nextNumber(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
  var c=1;try{c=(parseInt(localStorage.getItem('fp_counter')||'0',10)||0)+1}catch(e){}
  return 'КП-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(c);
}
function bumpCounter(){try{localStorage.setItem('fp_counter',String((parseInt(localStorage.getItem('fp_counter')||'0',10)||0)+1))}catch(e){}}

/* поля формы */
var textMap={company:'company',contact:'contact',client:'client',title:'title',number:'number',terms:'terms'};
function fillForm(){
  for(var k in textMap)$(textMap[k]).value=S[k]||'';
  $('currency').value=S.currency;
  renderItems();
}
function bindForm(){
  Object.keys(textMap).forEach(function(k){
    $(textMap[k]).addEventListener('input',function(e){S[k]=e.target.value;save();renderDoc()});
  });
  $('currency').addEventListener('change',function(e){S.currency=e.target.value;save();renderDoc()});
  $('addBtn').addEventListener('click',function(){
    S.items.push({d:'',q:1,p:0});save();renderItems();renderDoc();
    var rows=document.querySelectorAll('.item .desc');rows[rows.length-1].focus();
  });
  $('langBtn').addEventListener('click',function(){S.lang=S.lang==='ru'?'tm':'ru';save();applyLang();renderItems();renderDoc()});
  $('themeBtn').addEventListener('click',function(){S.theme=S.theme==='dark'?'light':'dark';save();applyTheme()});
  $('pdfBtn').addEventListener('click',function(){makePdf(false)});
  $('shareBtn').addEventListener('click',function(){makePdf(true)});
}

/* услуги */
function renderItems(){
  var t=T[S.lang],box=$('items');box.innerHTML='';
  S.items.forEach(function(it,i){
    var row=document.createElement('div');row.className='item';
    row.innerHTML='<input class="desc" type="text" placeholder="'+esc(t.descPh)+'" value="'+esc(it.d)+'">'
      +'<div class="item-b">'
      +'<input class="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="'+esc(t.qtyPh)+'" value="'+esc(it.q)+'">'
      +'<input class="price" type="number" inputmode="decimal" min="0" step="any" placeholder="'+esc(t.pricePh)+'" value="'+esc(it.p)+'">'
      +'<button class="del" type="button" aria-label="Удалить">✕</button></div>';
    row.querySelector('.desc').addEventListener('input',function(e){S.items[i].d=e.target.value;save();renderDoc()});
    row.querySelector('.qty').addEventListener('input',function(e){S.items[i].q=num(e.target.value);save();renderDoc()});
    row.querySelector('.price').addEventListener('input',function(e){S.items[i].p=num(e.target.value);save();renderDoc()});
    row.querySelector('.del').addEventListener('click',function(){
      if(S.items.length===1){S.items[0]={d:'',q:1,p:0}}else{S.items.splice(i,1)}
      save();renderItems();renderDoc();
    });
    box.appendChild(row);
  });
}

/* документ */
function docHTML(){
  var t=T[S.lang],d=t.doc,total=0;
  var rows=S.items.map(function(it,i){
    var sum=num(it.q)*num(it.p);total+=sum;
    return '<tr><td>'+(i+1)+'</td><td>'+(esc(it.d)||d.service)+'</td><td class="r">'+fmt(num(it.q))+'</td><td class="r">'+fmt(num(it.p))+'</td><td class="r"><b>'+fmt(sum)+'</b></td></tr>';
  }).join('');
  var date=new Date().toLocaleDateString('ru-RU');
  return '<div class="d-head"><div><div class="d-co">'+esc(S.company)+'</div><div class="d-sub">'+esc(S.contact)+'</div></div>'
   +'<div class="d-no">'+esc(d.badge)+'<b>№ '+esc(S.number)+'</b>'+date+'</div></div>'
   +'<div class="d-to">'+d.to+'</div><div class="d-client">'+esc(S.client)+'</div>'
   +'<div class="d-title">'+(esc(S.title)||d.noTitle)+'</div>'
   +'<table><thead><tr><th>№</th><th>'+d.th1+'</th><th class="r">'+d.thq+'</th><th class="r">'+d.thp+', '+S.currency+'</th><th class="r">'+d.ths+', '+S.currency+'</th></tr></thead><tbody>'+rows+'</tbody></table>'
   +'<div class="d-total"><span>'+d.tot+'</span><b>'+fmt(total)+' '+S.currency+'</b></div>'
   +(S.terms.trim()?'<div class="d-terms"><b>'+d.ter+'</b>'+esc(S.terms)+'</div>':'')
   +'<div class="d-sign"><div>'+d.sg1+'</div><div>'+d.sg2+'</div></div>';
}
function renderDoc(){$('doc').innerHTML=docHTML();$('curLbl').textContent=S.currency}

/* язык и тема */
function applyLang(){
  var t=T[S.lang];
  document.documentElement.lang=S.lang==='ru'?'ru':'tk';
  document.querySelectorAll('[data-i]').forEach(function(el){var k=el.getAttribute('data-i');if(t[k])el.textContent=t[k]});
  $('langBtn').textContent=S.lang==='ru'?'Türkmençe':'Русский';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme',S.theme);
  $('themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=S.theme==='dark'?'#171a30':'#4f46e5';
}

/* всплывающая подсказка */
var toastTimer;
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},3200)}

/* PDF: библиотека грузится только при нажатии */
var pdfLib;
function loadPdfLib(){
  if(window.html2pdf)return Promise.resolve();
  if(pdfLib)return pdfLib;
  pdfLib=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=res;s.onerror=function(){pdfLib=null;rej(new Error('load'))};
    document.head.appendChild(s);
  });
  return pdfLib;
}
function fileName(){return (S.number||'KP').replace(/[^\w\-а-яА-Я]+/g,'_')+'.pdf'}

function makePdf(share){
  var t=T[S.lang],btns=[$('pdfBtn'),$('shareBtn')];
  btns.forEach(function(b){b.disabled=true});
  toast(t.msgPdf);
  loadPdfLib().then(function(){
    var holder=document.createElement('div');
    holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;';
    var page=document.createElement('div');
    page.className='doc';page.style.cssText='width:794px;border:0;border-radius:0;box-shadow:none;padding:40px;font-size:14px;';
    page.innerHTML=docHTML();
    holder.appendChild(page);document.body.appendChild(holder);
    var opt={margin:0,filename:fileName(),image:{type:'jpeg',quality:0.96},
      html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,windowWidth:794,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css']}};
    var job=window.html2pdf().set(opt).from(page);
    var p=share?job.outputPdf('blob'):job.save();
    return Promise.resolve(p).then(function(res){
      document.body.removeChild(holder);
      if(!share){bumpAfter();toast(t.msgDone);return}
      var file=new File([res],fileName(),{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        return navigator.share({files:[file],title:S.title||'КП'}).then(bumpAfter).catch(function(e){if(e&&e.name!=='AbortError')throw e});
      }
      var a=document.createElement('a');a.href=URL.createObjectURL(res);a.download=fileName();document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
      bumpAfter();toast(t.msgShareNo);
    },function(err){document.body.removeChild(holder);throw err});
  }).catch(function(e){
    toast(e&&e.message==='load'?t.msgLoadErr:t.msgErr);
  }).then(function(){btns.forEach(function(b){b.disabled=false})});
}
function bumpAfter(){bumpCounter();S.number=nextNumber();save();$('number').value=S.number;renderDoc()}

load();applyTheme();applyLang();fillForm();bindForm();renderDoc();
if('serviceWorker' in navigator){/* офлайн-режим можно добавить позже */}
})();
</script>
</body>
</html>
